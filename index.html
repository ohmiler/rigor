<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIGOR</title>
  </head>
  <body>
    <div id="title">RIGOR <span>· prototype · one night, one street</span></div>
    <button id="fullscreen" type="button">Fullscreen</button>
    <div id="toast" hidden></div>
    <div id="hud">
      <pre id="stats"></pre>
      <div class="keys">
        <b>WASD</b> move · <b>Mouse</b> aim · <b>LMB</b> fire · <b>Shift</b> sprint · <b>Ctrl</b> walk · <b>R</b> reload · <b>N</b> spawn zombies · <b>T</b> slow-mo ·
        <b>P</b> pause · <b>B</b> skeleton · <b>F</b> face mouse · <b>Wheel</b> zoom
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
